[package]
name = "servo-media-native"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A pure-Rust servo-media backend: cpal for output, symphonia for decoding (audio only)."

[lib]
name = "servo_media_native"
path = "lib.rs"

[dependencies]
cpal = "0.17"
log = { workspace = true }
mime = { workspace = true }
servo-base = { workspace = true }
servo-media = { workspace = true }
servo-media-audio = { workspace = true }
servo-media-dummy = { workspace = true }
servo-media-player = { workspace = true }
servo-media-streams = { workspace = true }
servo-media-traits = { workspace = true }
servo-media-webrtc = { workspace = true }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[lints]
workspace = true
