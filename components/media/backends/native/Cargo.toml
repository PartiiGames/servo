[package]
name = "servo-media-native"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A pure-Rust servo-media backend: cpal for output, symphonia for decoding (audio only)."

[lib]
name = "servo_media_native"
path = "lib.rs"

[dependencies]
cpal = { version = "0.17", optional = true }
log = { workspace = true }
mime = { workspace = true }
servo-base = { workspace = true }
servo-media = { workspace = true }
servo-media-audio = { workspace = true }
servo-media-dummy = { workspace = true }
servo-media-player = { workspace = true }
servo-media-streams = { workspace = true }
servo-media-traits = { workspace = true }
servo-media-webrtc = { workspace = true }
symphonia = { version = "0.5.5", default-features = false, features = ["adpcm", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

# cpal's own ALSA binding: to keep alsa-lib's probe errors off stderr when there's no sound card.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
alsa = { version = "0.11", optional = true }

[features]
default = ["device"]
# Sound output through cpal (links libasound on Linux). Without it the output is always the null
# output: Web Audio and <audio> still run, silently (headless servers without ALSA libraries).
device = ["dep:cpal", "dep:alsa"]

[lints]
workspace = true
